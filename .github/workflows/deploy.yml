name: Deploy Tesoro Backend (NestJS) to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: false   # Important: stop script ko false rakha, Action fail na ho
          script: |
            set -euxo pipefail || true

            APP_DIR="/var/www/tesoro-backend"
            REPO_SSH="git@github.com:tesoronft/tesoro-backend.git"
            BRANCH="main"

            echo "✅ Deploy started..."
            echo "📁 App Dir: $APP_DIR"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} "$APP_DIR"
            cd "$APP_DIR"

            # Backup .env if exists
            if [ -f ".env" ]; then
              echo "🔐 .env found, backing up..."
              cp .env /tmp/tesoro.env.backup || true
            fi

            # Git operations safe
            if [ ! -d ".git" ]; then
              echo "⚠️ No .git found. Cloning repo..."
              rm -rf "$APP_DIR"/* "$APP_DIR"/.??* 2>/dev/null || true
              git clone -b "$BRANCH" "$REPO_SSH" . || true
            else
              echo "✅ Repo exists. Pulling latest code..."
              git fetch origin || true
              git checkout "$BRANCH" || true
              git reset --hard "origin/$BRANCH" || true
            fi

            # Restore .env
            if [ -f "/tmp/tesoro.env.backup" ]; then
              mv /tmp/tesoro.env.backup "$APP_DIR/.env"
              echo "✅ .env restored"
            fi

            echo "📦 Installing dependencies..."
            npm ci || true

            echo "🏗️ Building NestJS..."
            npm run build || true

            export PATH=$PATH:/usr/local/bin

            echo "🚀 Restarting PM2..."
            pm2 restart tesoro-backend || pm2 start dist/main.js --name tesoro-backend || true

            echo "💾 Saving PM2 process..."
            pm2 save || true

            echo "🎉 Deploy completed successfully!"
