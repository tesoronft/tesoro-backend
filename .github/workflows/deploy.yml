name: Deploy NestJS to EC2

on:
  push:
    branches:
      - main # Jab main branch me push ho, workflow trigger ho

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/tesoro-backend || exit 1

            # Clone if first time
            if [ ! -d ".git" ]; then
              git clone git@github.com:tesoronft/tesoro-backend.git .
            else
              git fetch --all
              git reset --hard origin/main
            fi

            # Install dependencies & build
            npm install
            npm run build

            # Restart backend with PM2
            pm2 restart nest-backend || pm2 start dist/main.js --name nest-backend
            pm2 save
