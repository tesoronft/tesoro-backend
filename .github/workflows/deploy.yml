name: Deploy Tesoro Backend (NestJS) to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            # 🔹 Exit on errors, but ignore certain safe commands
            set -euxo pipefail

            APP_DIR="/var/www/tesoro-backend"
            REPO_SSH="git@github.com:tesoronft/tesoro-backend.git"
            BRANCH="main"

            echo "✅ Deploy started..."
            echo "📁 App Dir: $APP_DIR"

            # Ensure folder exists
            sudo mkdir -p "$APP_DIR"
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} "$APP_DIR"
            cd "$APP_DIR"

            # Backup .env if exists
            if [ -f ".env" ]; then
              echo "🔐 .env found, backing up..."
              cp .env /tmp/tesoro.env.backup || true
            fi

            # 🔹 Handle .git safely without failing Action
            set +e
            if [ ! -d ".git" ]; then
              echo "⚠️ No .git found. Doing fresh clone..."
              
              # Clean folder safely
              rm -rf "$APP_DIR"/* "$APP_DIR"/.??* 2>/dev/null || true

              # Clone repo
              git clone -b "$BRANCH" "$REPO_SSH" . || true
            else
              echo "✅ Repo exists. Pulling latest code..."
              git fetch origin || true
              git checkout "$BRANCH" || true
              git reset --hard "origin/$BRANCH" || true
            fi
            set -e

            # Restore .env if backup exists
            if [ -f "/tmp/tesoro.env.backup" ]; then
              mv /tmp/tesoro.env.backup "$APP_DIR/.env"
              echo "✅ .env restored"
            fi

            echo "📦 Installing dependencies..."
            npm ci

            echo "🏗️ Building NestJS..."
            npm run build

            # Ensure pm2 exists in PATH
            export PATH=$PATH:/usr/local/bin

            echo "🚀 Restarting with PM2..."
            pm2 restart tesoro-backend || pm2 start dist/main.js --name tesoro-backend

            echo "💾 Saving PM2 process..."
            pm2 save

            echo "🎉 Deploy completed successfully!"
